{% extends "base.html" %}

{% block content %}

<div class="container-fluid">


<!-- ================= ENCABEZADO ================= -->

<div class="card shadow-sm mb-4">

    <div class="card-body">

        <h2 class="text-primary mb-1">

            <i class="bi bi-credit-card-2-front-fill"></i>

            {{ titulo }}

        </h2>

        <p class="text-muted mb-0">

            Gestión de cuentas bancarias del Banco Python

        </p>

    </div>

</div>



<!-- ================= FORMULARIO ================= -->

<div class="card shadow border-0">

    <div class="card-body">


        <form method="post">

            {% csrf_token %}


            <div class="row">


                {% for field in form %}

                <div class="col-md-6 mb-3">


                    <label class="form-label fw-bold">

                        {{ field.label }}

                    </label>


                    {{ field }}


                    {% if field.errors %}

                        <div class="text-danger small">

                            {{ field.errors }}

                        </div>

                    {% endif %}


                </div>

                {% endfor %}


            </div>



            <hr>


            <div class="text-end">


                <button class="btn btn-primary">

                    <i class="bi bi-save-fill"></i>

                    Guardar

                </button>


                <a href="{% url 'lista_cuentas' %}"

                   class="btn btn-secondary">

                    <i class="bi bi-x-circle"></i>

                    Cancelar

                </a>


            </div>


        </form>


    </div>

</div>


</div>

{% endblock %}
