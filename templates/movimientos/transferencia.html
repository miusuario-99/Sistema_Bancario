{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <!-- ================= ENCABEZADO ================= -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h2 class="text-primary mb-1">

                <i class="bi bi-arrow-left-right"></i>

                Registrar Transferencia

            </h2>

            <p class="text-muted mb-0">

                Transferencia de dinero entre cuentas bancarias.

            </p>

        </div>

    </div>

    <!-- ================= FORMULARIO ================= -->

    <div class="card shadow border-0">

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">

                            Cuenta Origen

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-credit-card"></i>

                            </span>

                            <input
                                type="text"
                                name="origen"
                                class="form-control"
                                placeholder="Ingrese la cuenta origen"
                                required>

                        </div>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">

                            Cuenta Destino

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-credit-card-2-front"></i>

                            </span>

                            <input
                                type="text"
                                name="destino"
                                class="form-control"
                                placeholder="Ingrese la cuenta destino"
                                required>

                        </div>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">

                            Monto

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                S/.

                            </span>

                            <input
                                type="number"
                                name="monto"
                                step="0.01"
                                min="0.01"
                                class="form-control"
                                placeholder="Ingrese el monto"
                                required>

                        </div>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">

                            Descripción

                        </label>

                        <input
                            type="text"
                            name="descripcion"
                            class="form-control"
                            placeholder="Motivo de la transferencia (opcional)">

                    </div>

                </div>

                <hr>

                <div class="text-end">

                    <button class="btn btn-primary">

                        <i class="bi bi-send-fill"></i>

                        Transferir

                    </button>

                    <a href="{% url 'dashboard' %}"
                       class="btn btn-secondary">

                        <i class="bi bi-x-circle"></i>

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
